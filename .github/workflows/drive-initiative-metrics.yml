name: DRIVE - Initiative Completion Rate Metrics

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print payloads without submitting)'
        required: false
        default: false
        type: boolean

env:
  CORTEX_API_URL: https://api.getcortexapp.com

jobs:
  submit-initiative-metrics:
    name: Submit Initiative Metrics - ${{ matrix.service.tag }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - tag: auth-service
          - tag: checkout-service
          - tag: inventory-service
          - tag: notifications-service
          - tag: payments-service
          - tag: profile-service
      fail-fast: false

    steps:
      - name: Generate Initiative Data
        id: initiative_data
        run: |
          TOTAL=$(( RANDOM % 10 + 5 ))
          COMPLETED=$(( RANDOM % (TOTAL + 1) ))
          IN_PROGRESS=$(( TOTAL - COMPLETED ))
          RATE=$(echo "scale=4; $COMPLETED / $TOTAL" | bc)
          RATE=$(echo $RATE | sed 's/^\./0./')

          echo "total=$TOTAL"             >> $GITHUB_OUTPUT
          echo "completed=$COMPLETED"     >> $GITHUB_OUTPUT
          echo "in_progress=$IN_PROGRESS" >> $GITHUB_OUTPUT
          echo "rate=$RATE"               >> $GITHUB_OUTPUT

          echo "service=${{ matrix.service.tag }}  completed=$COMPLETED/$TOTAL  in_progress=$IN_PROGRESS  rate=$RATE"

      - name: Submit drive-initiative-completion-rate
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          curl -sf -X POST \
            "${{ env.CORTEX_API_URL }}/api/v1/eng-intel/custom-metrics/drive-initiative-completion-rate/entity/${{ matrix.service.tag }}" \
            -H "Authorization: Bearer ${{ secrets.CORTEX_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"value\":${{ steps.initiative_data.outputs.rate }}}"
          echo "✅ drive-initiative-completion-rate => ${{ steps.initiative_data.outputs.rate }}"

      - name: Submit drive-initiative-completed-count
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          curl -sf -X POST \
            "${{ env.CORTEX_API_URL }}/api/v1/eng-intel/custom-metrics/drive-initiative-completed-count/entity/${{ matrix.service.tag }}" \
            -H "Authorization: Bearer ${{ secrets.CORTEX_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"value\":${{ steps.initiative_data.outputs.completed }}}"
          echo "✅ drive-initiative-completed-count => ${{ steps.initiative_data.outputs.completed }}"

      - name: Submit drive-initiative-in-progress-count
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          curl -sf -X POST \
            "${{ env.CORTEX_API_URL }}/api/v1/eng-intel/custom-metrics/drive-initiative-in-progress-count/entity/${{ matrix.service.tag }}" \
            -H "Authorization: Bearer ${{ secrets.CORTEX_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"value\":${{ steps.initiative_data.outputs.in_progress }}}"
          echo "✅ drive-initiative-in-progress-count => ${{ steps.initiative_data.outputs.in_progress }}"

      - name: Dry Run Output
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "=== DRY RUN: ${{ matrix.service.tag }} ==="
          echo "drive-initiative-completion-rate   = ${{ steps.initiative_data.outputs.rate }}"
          echo "drive-initiative-completed-count   = ${{ steps.initiative_data.outputs.completed }}"
          echo "drive-initiative-in-progress-count = ${{ steps.initiative_data.outputs.in_progress }}"
