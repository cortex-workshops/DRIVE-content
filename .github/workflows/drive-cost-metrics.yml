name: DRIVE — Cloud Spend & AI Token Metrics

on:
  schedule:
    - cron: '0 6 * * *'  # 6am UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print payloads without submitting to Cortex'
        required: false
        default: false
        type: boolean

env:
  CORTEX_API_URL: https://api.getcortexapp.com
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

jobs:
  cloud-spend:
    name: Cloud spend — ${{ matrix.service.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { tag: auth-service,          monthly_budget: 4000 }
          - { tag: checkout-service,      monthly_budget: 7500 }
          - { tag: inventory-service,     monthly_budget: 5000 }
          - { tag: notifications-service, monthly_budget: 2500 }
          - { tag: payments-service,      monthly_budget: 9000 }
          - { tag: profile-service,       monthly_budget: 3500 }
    steps:
      - name: Compute simulated MTD spend
        id: data
        run: |
          # Simulate a full-month spend between 60% and 130% of budget,
          # then prorate to today's day-of-month.
          DAY=$(date +%-d)
          DAYS_IN_MONTH=$(date -d "$(date +%Y-%m-01) +1 month -1 day" +%-d)
          BUDGET=${{ matrix.service.monthly_budget }}

          FULL_MONTH_PCT=$(awk -v r=$((RANDOM % 70 + 60)) 'BEGIN { printf "%.4f", r / 100 }')
          FULL_MONTH=$(awk -v b=$BUDGET -v p=$FULL_MONTH_PCT 'BEGIN { printf "%.2f", b * p }')
          ACTUAL=$(awk -v f=$FULL_MONTH -v d=$DAY -v t=$DAYS_IN_MONTH 'BEGIN { printf "%.2f", f * d / t }')
          VARIANCE=$(awk -v a=$ACTUAL -v b=$BUDGET 'BEGIN { printf "%.2f", a - b }')
          UTILIZATION=$(awk -v a=$ACTUAL -v b=$BUDGET 'BEGIN { printf "%.4f", a / b }')

          {
            echo "actual=$ACTUAL"
            echo "budget=$BUDGET"
            echo "variance=$VARIANCE"
            echo "utilization=$UTILIZATION"
          } >> $GITHUB_OUTPUT

          echo "::notice::${{ matrix.service.tag }} — actual=\$$ACTUAL  budget=\$$BUDGET  variance=\$$VARIANCE  utilization=$UTILIZATION"

      - name: Submit cloud spend metrics to Cortex
        env:
          CORTEX_API_TOKEN: ${{ secrets.CORTEX_API_TOKEN }}
        run: |
          submit() {
            local metric_id=$1
            local value=$2
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[dry-run] $metric_id => $value"
              return
            fi
            curl -sf -X POST \
              "$CORTEX_API_URL/api/v1/eng-intel/custom-metrics/$metric_id/entity/${{ matrix.service.tag }}" \
              -H "Authorization: Bearer $CORTEX_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"value\":$value}"
            echo "✅ $metric_id => $value"
          }

          submit drive-cost-cloud-spend-mtd    ${{ steps.data.outputs.actual }}
          submit drive-cost-cloud-budget       ${{ steps.data.outputs.budget }}
          submit drive-cost-cloud-variance     ${{ steps.data.outputs.variance }}
          submit drive-cost-cloud-utilization  ${{ steps.data.outputs.utilization }}

  ai-token-spend:
    name: AI token spend — ${{ matrix.service.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { tag: auth-service,          monthly_budget: 150 }
          - { tag: checkout-service,      monthly_budget: 300 }
          - { tag: inventory-service,     monthly_budget: 200 }
          - { tag: notifications-service, monthly_budget: 100 }
          - { tag: payments-service,      monthly_budget: 400 }
          - { tag: profile-service,       monthly_budget: 175 }
    steps:
      - name: Compute simulated MTD AI token spend
        id: data
        run: |
          # Simulate full-month token volumes, prorate to today.
          # Cost approximated using Claude Sonnet 4 rates: $3/1M input, $15/1M output.
          DAY=$(date +%-d)
          DAYS_IN_MONTH=$(date -d "$(date +%Y-%m-01) +1 month -1 day" +%-d)
          BUDGET=${{ matrix.service.monthly_budget }}

          FULL_INPUT=$(( RANDOM * RANDOM % 4000000 + 500000 ))
          FULL_OUTPUT=$(( RANDOM * RANDOM % 800000 + 100000 ))
          INPUT_TOKENS=$(awk -v f=$FULL_INPUT -v d=$DAY -v t=$DAYS_IN_MONTH 'BEGIN { printf "%d", f * d / t }')
          OUTPUT_TOKENS=$(awk -v f=$FULL_OUTPUT -v d=$DAY -v t=$DAYS_IN_MONTH 'BEGIN { printf "%d", f * d / t }')
          COST=$(awk -v i=$INPUT_TOKENS -v o=$OUTPUT_TOKENS 'BEGIN { printf "%.2f", (i * 3 + o * 15) / 1000000 }')

          {
            echo "input_tokens=$INPUT_TOKENS"
            echo "output_tokens=$OUTPUT_TOKENS"
            echo "cost=$COST"
            echo "budget=$BUDGET"
          } >> $GITHUB_OUTPUT

          echo "::notice::${{ matrix.service.tag }} — input=$INPUT_TOKENS  output=$OUTPUT_TOKENS  cost=\$$COST  budget=\$$BUDGET"

      - name: Submit AI token metrics to Cortex
        env:
          CORTEX_API_TOKEN: ${{ secrets.CORTEX_API_TOKEN }}
        run: |
          submit() {
            local metric_id=$1
            local value=$2
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[dry-run] $metric_id => $value"
              return
            fi
            curl -sf -X POST \
              "$CORTEX_API_URL/api/v1/eng-intel/custom-metrics/$metric_id/entity/${{ matrix.service.tag }}" \
              -H "Authorization: Bearer $CORTEX_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"value\":$value}"
            echo "✅ $metric_id => $value"
          }

          submit drive-cost-ai-input-tokens  ${{ steps.data.outputs.input_tokens }}
          submit drive-cost-ai-output-tokens ${{ steps.data.outputs.output_tokens }}
          submit drive-cost-ai-spend-mtd     ${{ steps.data.outputs.cost }}
          submit drive-cost-ai-budget        ${{ steps.data.outputs.budget }}
